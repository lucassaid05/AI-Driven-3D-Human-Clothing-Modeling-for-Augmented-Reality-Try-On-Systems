<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Gaussian Splat viewer — Pix2Surf roadmap</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #12121a;
      --border: rgba(255,255,255,0.08);
      --cyan: #00f5d4;
      --muted: #a0a0b0;
      --err: #f72585;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: ui-monospace, monospace;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 0.95rem; font-weight: 600; }
    header a { color: var(--cyan); text-decoration: none; font-size: 0.8rem; }
    header a:hover { text-decoration: underline; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      flex: 1;
    }
    .toolbar input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #1a1a24;
      color: #fff;
      font: inherit;
    }
    button, label.file-btn {
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #1e1e2e;
      color: var(--cyan);
      font: inherit;
      cursor: pointer;
    }
    button:hover, label.file-btn:hover { background: #2a2a3a; }
    label.file-btn input { display: none; }
    #viewer-root {
      flex: 1;
      min-height: 320px;
      position: relative;
    }
    #status {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    #status.error { color: var(--err); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>3D Gaussian splats</h1>
    <nav><a href="../index.html">Home</a> · <a href="../legacy/ar-tryon-v13.html">AR try-on</a> · <a href="pipeline-dashboard.html">Pipeline</a></nav>
    <div class="toolbar">
      <input type="text" id="url-input" placeholder="URL to .ply, .splat, or .ksplat (same origin or CORS)" />
      <button type="button" id="btn-load-url">Load URL</button>
      <label class="file-btn">Local file<input type="file" id="file-input" accept=".ply,.splat,.ksplat"></label>
    </div>
  </header>
  <div id="viewer-root"></div>
  <div id="status">Load a splat file from HumanSplat or another 3DGS exporter. Uses <a href="https://github.com/mkkellogg/GaussianSplats3D" style="color:var(--cyan)">GaussianSplats3D</a> (CDN).</div>

  <script type="module">
    import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

    const root = document.getElementById('viewer-root');
    const statusEl = document.getElementById('status');
    const urlInput = document.getElementById('url-input');
    const fileInput = document.getElementById('file-input');

    /** @type {import('@mkkellogg/gaussian-splats-3d').Viewer | null} */
    let viewer = null;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
    }

    async function disposeViewer() {
      if (viewer) {
        await viewer.dispose();
        viewer = null;
      }
      root.replaceChildren();
    }

    /**
     * @param {string} path - URL or blob: URL
     */
    async function loadSplat(path) {
      await disposeViewer();
      setStatus('Loading…');
      try {
        viewer = new GaussianSplats3D.Viewer({
          rootElement: root,
          cameraUp: [0, 1, 0],
          initialCameraPosition: [0, 1.6, 3.2],
          initialCameraLookAt: [0, 1, 0],
          selfDrivenMode: true,
          useBuiltInControls: true,
          sharedMemoryForWorkers: false,
        });
        await viewer.addSplatScene(path, {
          splatAlphaRemovalThreshold: 5,
          progressiveLoad: false,
          showLoadingUI: true,
          position: [0, 0, 0],
          rotation: [0, 0, 0, 1],
          scale: [1, 1, 1],
        });
        viewer.start();
        setStatus('Orbit: drag · zoom: scroll · right-drag: pan');
      } catch (e) {
        console.error(e);
        setStatus(String(e.message || e), true);
        await disposeViewer();
      }
    }

    document.getElementById('btn-load-url').addEventListener('click', () => {
      const u = urlInput.value.trim();
      if (!u) {
        setStatus('Enter a URL first.', true);
        return;
      }
      void loadSplat(u);
    });

    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      if (!f) return;
      const blobUrl = URL.createObjectURL(f);
      void loadSplat(blobUrl).finally(() => URL.revokeObjectURL(blobUrl));
      fileInput.value = '';
    });

    const q = new URLSearchParams(location.search).get('url');
    if (q) {
      urlInput.value = q;
      void loadSplat(q);
    }
  </script>
</body>
</html>
